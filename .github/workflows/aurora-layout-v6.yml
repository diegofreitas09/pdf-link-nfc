name: Aurora layout financeiro v6
on:
  push:
    paths:
      - '.github/workflows/aurora-layout-v6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar interface Aurora
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('aurora-gestao-2027/index.html')
          s=p.read_text(encoding='utf-8')

          css = '\n/* v6: alunos em cards, fonte maior e financeiro sem cortes */\n.student-list{display:grid;gap:16px}\n.student-card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:18px;box-shadow:0 2px 10px #0b1f3608}\n.student-head{display:grid;grid-template-columns:minmax(230px,1.6fr) repeat(4,minmax(140px,.75fr));gap:12px;align-items:end}\n.student-id{align-self:center}.student-id b{display:block;font-size:16px;line-height:1.25}.student-id span{display:block;color:var(--m);font-size:12px;margin-top:4px}\n.control label,.money-field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:var(--m);margin:0 0 6px}\n.student-card input,.student-card select,.student-card textarea{font-size:13px;padding:10px 11px}\n.finance-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}\n.year-box{border:1px solid var(--l);border-radius:14px;padding:15px;background:#f8fafc}.year-box.y2026{border-top:4px solid #2563eb}.year-box.y2027{border-top:4px solid #0f766e}\n.year-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.year-title b{font-size:17px}.year-title span{font-size:11px;color:var(--m)}\n.money-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}\n.money-read{min-height:43px;border:1px solid #d9e2ec;border-radius:10px;padding:10px 11px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px}.money-read span{font-size:11px;color:var(--m)}.money-read strong{font-size:14px;white-space:nowrap}\n.discount-box{margin-top:11px;padding:11px 12px;border-radius:11px;background:#eef6ff;border:1px solid #dbeafe;font-size:12px;line-height:1.45}.discount-box.ok{background:#ecfdf5;border-color:#bbf7d0;color:#166534}.discount-box.warnx{background:#fff7ed;border-color:#fed7aa;color:#9a3412}.discount-box.neutral{background:#f8fafc;border-color:#e2e8f0;color:#64748b}.discount-box b{font-size:13px}.discount-pair{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}\n.student-foot{display:grid;grid-template-columns:1fr 270px;gap:12px;margin-top:13px;align-items:start}.student-note textarea{min-height:72px}.helper{font-size:10px;color:var(--m);margin-top:5px;line-height:1.35}\n@media(max-width:1250px){.student-head{grid-template-columns:1.4fr repeat(2,1fr)}.student-id{grid-column:1/-1}.student-foot{grid-template-columns:1fr 220px}}\n@media(max-width:1100px){.finance-wrap{grid-template-columns:1fr}}\n@media(max-width:900px){.student-head{grid-template-columns:1fr 1fr}.student-id{grid-column:1/-1}.student-foot{grid-template-columns:1fr}}\n@media(max-width:560px){.student-head,.money-grid{grid-template-columns:1fr}.student-card{padding:14px}.year-box{padding:13px}.student-id{grid-column:auto}}\n'
          if '.student-list{display:grid;gap:16px}' not in s:
              s=s.replace('#toast{', css+'\n#toast{', 1)

          finance = 'function disc(table,paid){table=n(table);paid=n(paid);if(table===null||paid===null)return{value:null,pct:null,state:\'missing\'};let d=table-paid;if(Math.abs(d)<.005)return{value:0,pct:0,state:\'equal\'};return{value:d,pct:table?d/table:null,state:d>0?\'discount\':\'above\'}}\nfunction discountHTML(d,year){if(d.state===\'missing\')return `<div class="discount-box neutral"><b>Aguardando valor da escola</b><div>Preencha a tabela ${year} para calcular o desconto.</div></div>`;if(d.state===\'equal\')return `<div class="discount-box neutral"><b>Sem desconto</b><div>O valor da família está igual à tabela da escola.</div></div>`;if(d.state===\'above\')return `<div class="discount-box warnx"><b>Família paga acima da tabela</b><div class="discount-pair"><span>Diferença: <b>${brl(Math.abs(d.value))}</b></span><span>Percentual: <b>${pct(Math.abs(d.pct))}</b></span></div><div class="helper">Confira se a tabela da escola foi digitada corretamente.</div></div>`;return `<div class="discount-box ok"><b>Desconto concedido</b><div class="discount-pair"><span>Valor: <b>${brl(d.value)}</b></span><span>Percentual: <b>${pct(d.pct)}</b></span></div></div>`}\nfunction sc(s){let r=rate(s),base=n(s.base2026),extra=n(s.extra2026)??0,total=n(s.totalPago2026),t26=n(s.valorOficial2026)??n(r?.valorTabela2026),d26=disc(t26,base),t27=n(r?.valor2027),c27=n(s.valor2027Cobrado),d27=disc(t27,c27),inc=base&&c27!==null?c27/base-1:null;return{r,base,extra,total,t26,d26,t27,c27,d27,inc}}'
          s,n1=re.subn(r"function disc\(t,p\)\{.*?\}\nfunction sc\(s\)\{.*?\}\n", finance+'\n', s, count=1, flags=re.S)
          if n1!=1:
              raise SystemExit('finance functions not found')

          students = 'function students(){let ts=turmaList(),mods=modalidadeList();$(\'#students\').innerHTML=sec(\'Alunos & descontos\',\'Comparação clara entre valor da escola, valor pago pela família e desconto em 2026 e 2027.\',\'<button id="toggleStudent" class="btn alt">+ Adicionar aluno</button>\')+`<div id="studentPanel" class="panel"><div class="card"><div class="formgrid"><div class="field"><label>Aluno</label><input id="na" placeholder="Nome completo"></div><div class="field"><label>Responsável</label><input id="nr"></div><div class="field"><label>Serei 2027</label><select id="ny">${sereiOptions(\'em_analise\')}</select></div><div class="field"><label>Turma</label><select id="nt">${options(ts,\'\',\'Selecione a turma\')}</select></div><div class="field"><label>Turno</label><select id="nturno">${options(TURNOS,\'\',\'Selecione o turno\')}</select></div><div class="field"><label>Modalidade</label><select id="ns">${options(mods,\'\',\'Selecione a modalidade\')}</select></div><div class="field"><label>Mensalidade/base paga 2026</label><input id="nb" type="number" step=".01"></div><div class="field"><label>Extras 2026</label><input id="nextra" type="number" step=".01"></div><div class="field"><label>Valor da escola / tabela 2026</label><input id="n26" type="number" step=".01"></div><div class="field"><label>Valor da escola / tabela 2027</label><input id="nt27" type="number" step=".01"></div><div class="field"><label>Valor cobrado da família 2027</label><input id="n27" type="number" step=".01"></div><div class="field span4"><label>Observação</label><textarea id="nobs" placeholder="Acordo, desconto, permanência, alimentação, alteração de modalidade..."></textarea></div></div><div class="formactions"><button id="cancelStudent" class="btn ghost">Cancelar</button><button id="saveStudent" class="btn">Salvar aluno</button></div></div></div><div class="filters four"><input id="sq" placeholder="Buscar aluno, responsável ou modalidade"><select id="stu"><option value="">Todas as turmas</option>${ts.map(x=>`<option>${esc(x)}</option>`).join(\'\')}</select><select id="sy"><option value="">Todos: Serei 2027</option><option value="sim">Sim</option><option value="nao">Não</option><option value="em_analise">Em análise</option></select><select id="s27"><option value="">Todos os valores</option><option value="com">Com valor 2027</option><option value="sem">Sem valor 2027</option></select></div><div id="studentsTable"></div>`;\n$(\'#toggleStudent\').onclick=()=>$(\'#studentPanel\').classList.toggle(\'open\');$(\'#cancelStudent\').onclick=()=>$(\'#studentPanel\').classList.remove(\'open\');$(\'#saveStudent\').onclick=()=>{let aluno=$(\'#na\').value.trim(),turma=$(\'#nt\').value,servico=$(\'#ns\').value;if(!aluno||!turma||!servico)return toast(\'Preencha aluno, turma e modalidade.\',true);let base=n($(\'#nb\').value),extra=n($(\'#nextra\').value)??0,r=S.monthlyRates.find(x=>x.turma===turma&&x.servico===servico);if(!r){r={id:\'mens-\'+Date.now(),turma,servico,periodicidade:\'mensal\',valorTabela2026:null,valor2027:null,status2027:\'rascunho\',fonte2026:\'\',observacao:\'\'};S.monthlyRates.push(r)}if(n($(\'#nt27\').value)!==null)r.valor2027=n($(\'#nt27\').value);S.students.push({id:\'alu-2026-\'+String(Date.now()).slice(-9),turma,aluno,servico,responsavel:$(\'#nr\').value.trim(),turno:$(\'#nturno\').value,serei2027:$(\'#ny\').value,base2026:base,extra2026:extra,totalPago2026:base===null?null:base+extra,reajuste2027:S.settings.globalAdjustment||.1,observacao:$(\'#nobs\').value.trim(),fonte:\'Plataforma Aurora\',valorOficial2026:n($(\'#n26\').value),fonteOficial:\'\',valor2027Cobrado:n($(\'#n27\').value),status2027:\'simulacao\',observacao2027:$(\'#nobs\').value.trim()});saveSoon();students();toast(\'Aluno adicionado\')};[\'sq\',\'stu\',\'sy\',\'s27\'].forEach(i=>$(\'#\'+i).oninput=drawStudents);drawStudents()}\nfunction drawStudents(){let q=($(\'#sq\')?.value||\'\').toLowerCase(),t=$(\'#stu\')?.value||\'\',y=$(\'#sy\')?.value||\'\',f=$(\'#s27\')?.value||\'\',rows=S.students.filter(s=>(!q||[s.aluno,s.responsavel,s.servico,s.turma,s.turno,s.observacao2027].join(\' \').toLowerCase().includes(q))&&(!t||s.turma===t)&&(!y||(s.serei2027||\'em_analise\')===y)&&(!f||(f===\'com\'&&n(s.valor2027Cobrado)!==null)||(f===\'sem\'&&n(s.valor2027Cobrado)===null)));let yes=rows.filter(s=>s.serei2027===\'sim\').length,no=rows.filter(s=>s.serei2027===\'nao\').length,ana=rows.filter(s=>(s.serei2027||\'em_analise\')===\'em_analise\').length;$(\'#studentsTable\').innerHTML=`<div class="summary"><span><b>${rows.length}</b> alunos/linhas</span><span>Sim <b>${yes}</b></span><span>Não <b>${no}</b></span><span>Em análise <b>${ana}</b></span><span>Desconto 2026 usa a mensalidade/base; extras ficam separados.</span></div><div class="student-list">${rows.map(s=>{let c=sc(s),r=c.r;return `<article class="student-card"><div class="student-head"><div class="student-id"><b>${esc(s.aluno)}</b><span>Responsável: ${esc(s.responsavel||\'—\')}</span></div><div class="control"><label>Serei 2027</label><select data-type="student" data-id="${esc(s.id)}" data-f="serei2027">${sereiOptions(s.serei2027||\'em_analise\')}</select></div><div class="control"><label>Turma</label><select data-type="student" data-id="${esc(s.id)}" data-f="turma">${options(turmaList(),s.turma)}</select></div><div class="control"><label>Turno</label><select data-type="student" data-id="${esc(s.id)}" data-f="turno">${options(TURNOS,s.turno||\'\',\'Selecionar turno\')}</select></div><div class="control"><label>Modalidade</label><select data-type="student" data-id="${esc(s.id)}" data-f="servico">${options(modalidadeList(),s.servico)}</select></div></div><div class="finance-wrap"><section class="year-box y2026"><div class="year-title"><b>2026 · Real praticado</b><span>histórico da família</span></div><div class="money-grid"><div class="money-field"><label>Valor da escola / tabela 2026</label><input data-type="student" data-id="${esc(s.id)}" data-f="valorOficial2026" data-num="1" type="number" step=".01" value="${s.valorOficial2026??r?.valorTabela2026??\'\'}" placeholder="Informe a tabela 2026"></div><div class="money-field"><label>Mensalidade/base paga pela família</label><div class="money-read"><span>Família paga</span><strong>${brl(c.base)}</strong></div></div><div class="money-field"><label>Extras registrados</label><div class="money-read"><span>Extras</span><strong>${brl(c.extra)}</strong></div></div><div class="money-field"><label>Total registrado 2026</label><div class="money-read"><span>Total</span><strong>${brl(c.total)}</strong></div></div></div>${discountHTML(c.d26,\'2026\')}</section><section class="year-box y2027"><div class="year-title"><b>2027 · Proposta</b><span>tabela e negociação</span></div><div class="money-grid"><div class="money-field"><label>Valor da escola / tabela 2027</label>${r?`<input data-type="fee" data-id="${esc(r.id)}" data-f="valor2027" data-num="1" type="number" step=".01" value="${r.valor2027??\'\'}" placeholder="Informe a tabela 2027"><div class="helper">Aplicado à turma + modalidade.</div>`:`<input disabled placeholder="Sem modalidade vinculada">`}</div><div class="money-field"><label>Valor cobrado da família 2027</label><input data-type="student" data-id="${esc(s.id)}" data-f="valor2027Cobrado" data-num="1" type="number" step=".01" value="${s.valor2027Cobrado??\'\'}" placeholder="Informe o valor da família"></div></div>${discountHTML(c.d27,\'2027\')}<div class="discount-box neutral"><b>Reajuste real da família</b><div class="discount-pair"><span>Mensalidade/base 2026 → cobrado 2027</span><span><b>${pct(c.inc)}</b></span></div></div></section></div><div class="student-foot"><div class="student-note"><label class="mini">OBSERVAÇÃO</label><textarea data-type="student" data-id="${esc(s.id)}" data-f="observacao2027">${esc(s.observacao2027||s.observacao||\'\')}</textarea></div><div class="student-status"><label class="mini">STATUS 2027</label><select data-type="student" data-id="${esc(s.id)}" data-f="status2027"><option value="simulacao" ${s.status2027===\'simulacao\'?\'selected\':\'\'}>Simulação</option><option value="proposto" ${s.status2027===\'proposto\'?\'selected\':\'\'}>Proposto</option><option value="confirmado" ${s.status2027===\'confirmado\'?\'selected\':\'\'}>Confirmado</option></select></div></div></article>`}).join(\'\')}</div>`}'
          s,n2=re.subn(r"function students\(\)\{.*?\nfunction products\(\)", students+'\nfunction products()', s, count=1, flags=re.S)
          if n2!=1:
              raise SystemExit('students block not found')

          s=s.replace('Tabela, valor real, desconto e proposta de reajuste.','Valor da escola, valor pago pela família, desconto e proposta de reajuste.')
          s=s.replace('<div class="note"><b>2027 permanece em rascunho até aprovação.</b> Média paga serve para análise e nunca substitui a tabela oficial.</div>','<div class="note"><b>Leitura financeira:</b> em 2026 o desconto compara a tabela da escola com a mensalidade/base paga pela família; extras aparecem separados. Em 2027 a comparação usa a tabela proposta e o valor que será cobrado da família.</div>')
          s=s.replace('Tabela 2026 × média paga × desconto × novo valor.','Valor da escola 2026 × média paga × desconto × valor da escola 2027.')
          s=s.replace('Tabela 2026 / desconto','Valor escola / tabela 2026')
          s=s.replace('Valor 2027 / reajuste','Valor escola / tabela 2027')
          s=s.replace('if(el.dataset.num)R[active]()', "if(el.dataset.num||(type==='student'&&['turma','servico'].includes(el.dataset.f)))R[active]()")

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('aurora-gestao-2027/index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/aurora.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/aurora.js
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Aurora Automation"
          git config user.email "actions@users.noreply.github.com"
          git add aurora-gestao-2027/index.html
          git commit -m "Ajusta financeiro 2026 x 2027 e layout de alunos"
          git push
