name: Aurora Logo v19
on:
  push:
    paths:
      - '.github/workflows/aurora-logo-v19.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar caminhos da logo Aurora
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aurora-gestao-2027/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./aurora-logo.png?v=18','/aurora-logo.png?v=19')
          s=s.replace('./branding-v15.js?v=18','./branding-v15.js?v=19')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aurora-gestao-2027/index.html
          git diff --cached --quiet || git commit -m 'Fixa caminho público da logo Aurora v19'
          git push
