name: Aurora Realtime v21
on:
  push:
    paths:
      - '.github/workflows/aurora-realtime-v21.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir módulo Realtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aurora-gestao-2027/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./realtime-v21.js?v=21"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          s=s.replace('?v=20','?v=21')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aurora-gestao-2027/index.html
          git diff --cached --quiet || git commit -m 'Ativa atualização em tempo real na Aurora v21'
          git push