name: Aurora Branding v15
on:
  push:
    paths:
      - '.github/workflows/aurora-branding-v15.yml'
permissions:
  contents: write
jobs:
  ativar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir branding v15
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aurora-gestao-2027/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./branding-v15.js?v=15"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar alteração
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aurora-gestao-2027/index.html
          git commit -m 'Ativa identidade Aurora e crédito PDF Solução Educacional'
          git push