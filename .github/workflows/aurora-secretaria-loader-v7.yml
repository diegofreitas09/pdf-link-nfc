name: Aurora Secretaria v7
on:
  push:
    paths:
      - '.github/workflows/aurora-secretaria-loader-v7.yml'
permissions:
  contents: write
jobs:
  ativar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir módulo Secretaria na página Aurora
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aurora-gestao-2027/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./secretaria-v7.js?v=7"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar alteração
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aurora-gestao-2027/index.html
          git commit -m 'Ativa Secretaria, frequência e listas na Aurora'
          git push