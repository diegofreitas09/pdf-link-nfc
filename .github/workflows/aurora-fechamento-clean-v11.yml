name: Aurora Fechamento clean v11
on:
  push:
    paths:
      - '.github/workflows/aurora-fechamento-clean-v11.yml'
permissions:
  contents: write
jobs:
  ativar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir filtro de modalidades
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aurora-gestao-2027/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./fechamento-clean-v11.js?v=11"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar alteração
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add aurora-gestao-2027/index.html
          git commit -m 'Filtra modalidades da Secretaria pelo Fechamento 2027'
          git push