name: Aurora PWA v23
on:
  push:
    paths:
      - '.github/workflows/aurora-pwa-v23.yml'
permissions:
  contents: write
jobs:
  ativar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ativar manifesto e instalador PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aurora-gestao-2027/index.html')
          s=p.read_text(encoding='utf-8')
          manifest='<link rel="manifest" href="./manifest.webmanifest?v=23">'
          icon='<link rel="icon" href="./aurora-logo.webp?v=23" type="image/webp">'
          apple='<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Aurora 2027">'
          if manifest not in s:
              s=s.replace('<title>Aurora · Gestão da Direção 2027</title>', '<title>Aurora · Gestão da Direção 2027</title>\n'+manifest+'\n'+icon+'\n'+apple)
          tag='<script src="./pwa-v23.js?v=23"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar PWA
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aurora-gestao-2027/index.html
          git commit -m 'Ativa instalação da Aurora como PWA v23'
          git push