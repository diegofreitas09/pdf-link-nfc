name: Aurora Logo v18
on:
  push:
    paths:
      - '.github/workflows/aurora-logo-v18.yml'
permissions:
  contents: write
jobs:
  atualizar-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar versão da logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aurora-gestao-2027/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('aurora-logo.png?v=17','aurora-logo.png?v=18')
          s=s.replace('branding-v15.js?v=17','branding-v15.js?v=18')
          p.write_text(s,encoding='utf-8')
          b=Path('aurora-gestao-2027/branding-v15.js')
          x=b.read_text(encoding='utf-8')
          x=x.replace("aurora-logo.png?v=17","aurora-logo.png?v=18")
          b.write_text(x,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aurora-gestao-2027/index.html aurora-gestao-2027/branding-v15.js
          git commit -m 'Atualiza logo oficial Aurora v18'
          git push